<h2 mat-dialog-title>Delete Confirmation</h2>
<mat-dialog-content>
    <h3>Are you sure of deleting "{{ data.employeeName }}"?</h3>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton mat-dialog-close>Cancel</button>
    <button matButton cdkFocusInitial (click)="onDeleteRecord()">Submit</button>
</mat-dialog-actions>
